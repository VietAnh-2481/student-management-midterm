<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quản lý sinh viên</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }

      .main-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        margin-top: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .title {
        font-weight: bold;
        letter-spacing: 1px;
      }

      .search-box {
        border-radius: 30px;
        overflow: hidden;
      }

      .search-box input {
        border: none;
        box-shadow: none;
      }

      .search-box button {
        border: none;
      }

      .btn-add {
        border-radius: 30px;
        padding: 10px 20px;
      }

      table {
        border-radius: 10px;
        overflow: hidden;
      }

      table thead {
        background: #343a40;
        color: white;
      }

      table tbody tr:hover {
        background: #eef2ff;
        transition: 0.2s;
      }

      .action-btn {
        border-radius: 20px;
        margin: 2px;
      }

      .modal-content {
        border-radius: 20px;
        border: none;
      }

      .modal-header {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
      }

      .modal-body input {
        border-radius: 10px;
      }

      .loading {
        text-align: center;
        padding: 30px;
      }

      .empty-data {
        text-align: center;
        padding: 20px;
        color: gray;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="main-card">
        <!-- TITLE -->
        <h2 class="text-center text-primary mb-4 title">
          <i class="fa-solid fa-user-graduate"></i>
          HỆ THỐNG QUẢN LÝ SINH VIÊN
        </h2>

        <!-- SEARCH + ADD -->
        <div class="row mb-4 align-items-center">
          <div class="col-md-8">
            <div class="input-group search-box shadow-sm">
              <span class="input-group-text bg-white border-0">
                <i class="fa fa-search"></i>
              </span>

              <input
                type="text"
                id="searchName"
                class="form-control"
                placeholder="Nhập tên sinh viên..."
              />

              <button class="btn btn-primary" onclick="searchStudent()">
                Tìm kiếm
              </button>
            </div>
          </div>

          <div class="col-md-4 text-end">
            <button class="btn btn-success btn-add" onclick="prepareAdd()">
              <i class="fa fa-plus"></i>
              Thêm sinh viên
            </button>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Họ tên</th>
                <th>Tuổi</th>
                <th>Email</th>
                <th>Lớp</th>
                <th>SĐT</th>
                <th>Địa chỉ</th>
                <th class="text-center">Hành động</th>
              </tr>
            </thead>

            <tbody id="studentTableBody">
              <tr>
                <td colspan="7" class="loading">
                  <i class="fa fa-spinner fa-spin"></i>
                  Đang tải dữ liệu...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal fade" id="studentModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">Thông tin sinh viên</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="studentId" />

            <div class="mb-3">
              <label>Họ tên</label>

              <input type="text" id="name" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Tuổi</label>

              <input type="number" id="age" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Email</label>

              <input type="email" id="email" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Lớp</label>

              <input type="text" id="className" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Số điện thoại</label>

              <input type="text" id="phoneNumber" class="form-control" />
            </div>

            <div class="mb-3">
              <label>Địa chỉ</label>

              <input type="text" id="address" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>

            <button class="btn btn-primary" onclick="saveStudent()">
              <i class="fa fa-save"></i>
              Lưu lại
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // ================= API =================

      const API_URL = "http://localhost:1612/api/students";

      let studentModal;

      // ================= INIT =================

      document.addEventListener("DOMContentLoaded", () => {
        studentModal = new bootstrap.Modal(
          document.getElementById("studentModal"),
        );

        loadStudents();

        document
          .getElementById("searchName")
          .addEventListener("keyup", searchStudent);
      });

      // ================= LOAD =================

      async function loadStudents() {
        try {
          const res = await fetch(API_URL);

          if (!res.ok) {
            throw new Error("Không thể tải dữ liệu");
          }

          const data = await res.json();

          displayStudents(data);
        } catch (error) {
          console.error(error);

          document.getElementById("studentTableBody").innerHTML = `
        <tr>
          <td colspan="7" class="text-danger text-center">
            Không kết nối được Backend
          </td>
        </tr>
      `;
        }
      }

      // ================= DISPLAY =================

      function displayStudents(students) {
        const tableBody = document.getElementById("studentTableBody");

        if (!students || students.length === 0) {
          tableBody.innerHTML = `
        <tr>
          <td colspan="7" class="empty-data">
            Không có dữ liệu sinh viên
          </td>
        </tr>
      `;

          return;
        }

        let html = "";

        students.forEach((s) => {
          html += `
        <tr>

          <td>${s.name || ""}</td>

          <td>${s.age || ""}</td>

          <td>${s.email || ""}</td>

          <td>${s.className || ""}</td>

          <td>${s.phoneNumber || ""}</td>

          <td>${s.address || ""}</td>

          <td class="text-center">

            <button
              class="btn btn-warning btn-sm action-btn"
              onclick="editStudent('${s.id}')"
            >
              <i class="fa fa-pen"></i>
            </button>

            <button
              class="btn btn-danger btn-sm action-btn"
              onclick="deleteStudent('${s.id}')"
            >
              <i class="fa fa-trash"></i>
            </button>

          </td>

        </tr>
      `;
        });

        tableBody.innerHTML = html;
      }

      // ================= SEARCH =================

      async function searchStudent() {
        const name = document.getElementById("searchName").value;

        try {
          const res = await fetch(
            `${API_URL}/search?name=${encodeURIComponent(name)}`,
          );

          const data = await res.json();

          displayStudents(data);
        } catch (error) {
          console.error(error);
        }
      }

      // ================= ADD =================

      function prepareAdd() {
        resetForm();

        document.getElementById("modalTitle").innerText = "Thêm sinh viên";

        studentModal.show();
      }

      // ================= EDIT =================

      async function editStudent(id) {
        try {
          const res = await fetch(`${API_URL}/${id}`);

          const s = await res.json();

          document.getElementById("studentId").value = s.id;
          document.getElementById("name").value = s.name || "";
          document.getElementById("age").value = s.age || "";
          document.getElementById("email").value = s.email || "";
          document.getElementById("className").value = s.className || "";

          document.getElementById("phoneNumber").value = s.phoneNumber || "";

          document.getElementById("address").value = s.address || "";

          document.getElementById("modalTitle").innerText =
            "Cập nhật sinh viên";

          studentModal.show();
        } catch (error) {
          console.error(error);

          alert("Không thể tải dữ liệu sinh viên");
        }
      }

      // ================= SAVE =================

      async function saveStudent() {
        const id = document.getElementById("studentId").value;

        const student = {
          name: document.getElementById("name").value.trim(),

          age: parseInt(document.getElementById("age").value),

          email: document.getElementById("email").value.trim(),

          className: document.getElementById("className").value.trim(),

          phoneNumber: document.getElementById("phoneNumber").value.trim(),

          address: document.getElementById("address").value.trim(),
        };

        // VALIDATION

        if (!student.name) {
          alert("Vui lòng nhập họ tên");
          return;
        }

        if (!student.email) {
          alert("Vui lòng nhập email");
          return;
        }

        if (isNaN(student.age) || student.age <= 0) {
          alert("Tuổi không hợp lệ");
          return;
        }

        let url = API_URL;

        let method = "POST";

        if (id) {
          url = `${API_URL}/${id}`;
          method = "PUT";
        }

        try {
          const response = await fetch(url, {
            method: method,

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(student),
          });

          if (!response.ok) {
            const errorText = await response.text();

            throw new Error(errorText);
          }

          studentModal.hide();

          removeModalBackdrop();

          loadStudents();

          alert(id ? "Cập nhật thành công" : "Thêm sinh viên thành công");
        } catch (error) {
          console.error(error);

          alert(error.message);
        }
      }

      // ================= DELETE =================

      async function deleteStudent(id) {
        const confirmDelete = confirm("Bạn có chắc muốn xóa?");

        if (!confirmDelete) return;

        try {
          const res = await fetch(`${API_URL}/${id}`, {
            method: "DELETE",
          });

          if (!res.ok) {
            throw new Error("Xóa thất bại");
          }

          loadStudents();

          alert("Xóa thành công");
        } catch (error) {
          console.error(error);

          alert(error.message);
        }
      }

      // ================= RESET =================

      function resetForm() {
        document.getElementById("studentId").value = "";

        document.querySelectorAll(".modal-body input").forEach((input) => {
          input.value = "";
        });
      }

      // ================= FIX MODAL =================

      function removeModalBackdrop() {
        document
          .querySelectorAll(".modal-backdrop")
          .forEach((el) => el.remove());

        document.body.classList.remove("modal-open");

        document.body.style = "";
      }
    </script>
  </body>
</html>
